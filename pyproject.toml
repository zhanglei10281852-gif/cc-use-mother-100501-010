[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-replay"
version = "1.0.0"
description = "跨网络韧性演练与复盘平台：冻结场景、追加式事件日志、确定性重放与整改追溯"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
resilience-replay = "resilience_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
